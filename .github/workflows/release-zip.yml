name: Build HACS Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build integration ZIP
        run: |
          mkdir -p dist/chastity_calendar
          cp -r custom_components/chastity_calendar/. dist/chastity_calendar/
          cd dist
          zip -r ../community-events-calendar.zip chastity_calendar
          cd ..
          sha256sum community-events-calendar.zip > community-events-calendar.zip.sha256
      - name: Upload ZIP and checksum to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \\
            community-events-calendar.zip community-events-calendar.zip.sha256 --clobber
