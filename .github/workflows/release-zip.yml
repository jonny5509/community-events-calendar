name: Build HACS Release ZIP

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build integration ZIP
        run: |
          cd custom_components/chastity_calendar
          zip -r "$GITHUB_WORKSPACE/community-events-calendar.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum community-events-calendar.zip > community-events-calendar.zip.sha256
      - name: Upload ZIP and checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          fi
          if [ -z "$TAG" ]; then
            echo "No published release exists. Publish a release, then run this workflow again."
            exit 1
          fi
          gh release upload "$TAG" community-events-calendar.zip community-events-calendar.zip.sha256 --clobber
